<!DOCTYPE html>
<html>
<head>
    <title>Debug Dashboard</title>
    <style>
        .section { display: none; padding: 20px; border: 2px solid #ccc; margin: 10px; }
        .section.active { display: block; background: #f0f0f0; }
        button { padding: 10px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Debug: Test de Secciones</h1>
    
    <div>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('products')">Productos</button>
        <button onclick="showSection('users')">Usuarios</button>
        <button onclick="testShowProducts()">TEST Productos</button>
        <button onclick="forceShowProducts()">FORCE Productos</button>
    </div>

    <div id="dashboardSection" class="section active">
        <h2>Dashboard Section</h2>
        <p>Esta es la sección del dashboard</p>
    </div>

    <div id="productsSection" class="section">
        <h2>Products Section</h2>
        <p>Esta es la sección de productos</p>
        <div id="productsTableBody">Tabla de productos aquí</div>
    </div>

    <div id="usersSection" class="section">
        <h2>Users Section</h2>
        <p>Esta es la sección de usuarios</p>
    </div>

    <script>
        // Función showSection simplificada para pruebas
        function showSection(sectionName) {
            console.log('🔄 Debug - Cambiando a sección:', sectionName);
            
            // Ocultar todas las secciones
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
                console.log('❌ Ocultando:', section.id);
            });
            
            // Mostrar sección seleccionada
            const targetSection = document.getElementById(`${sectionName}Section`);
            console.log('🎯 Elemento encontrado:', targetSection);
            
            if (targetSection) {
                targetSection.classList.add('active');
                console.log('✅ Sección activada:', sectionName);
            } else {
                console.error('❌ No se encontró la sección:', `${sectionName}Section`);
            }
        }

        function testShowProducts() {
            console.log('🧪 TEST: Mostrando productos...');
            showSection('products');
        }

        function forceShowProducts() {
            console.log('🔧 FORCE: Mostrando productos...');
            const sections = document.querySelectorAll('.section');
            sections.forEach(s => s.classList.remove('active'));
            document.getElementById('productsSection').classList.add('active');
        }

        console.log('✅ Debug script cargado');
    </script>
</body>
</html>
