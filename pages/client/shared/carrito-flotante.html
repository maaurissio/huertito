<!-- Carrito Flotante Global -->
<div id="floating-cart-container">
    <!-- Botón flotante del carrito -->
    <div class="floating-cart-btn" id="floatingCartBtn">
        <div class="cart-icon">
            <img src="../../../icons/shopping-basket.svg" alt="Carrito" class="cart-svg-icon">
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </div>

    <!-- Overlay del carrito -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- Sidebar del carrito -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
                <h5 class="mb-0 fw-bold text-success">
                    <i class="fas fa-shopping-cart me-2"></i>
                    Mi Carrito
                </h5>
                <button class="btn btn-link text-muted p-0" id="closeCart">
                    <i class="fas fa-times fs-4"></i>
                </button>
            </div>
        </div>

        <div class="cart-body" id="cartBody">
            <!-- Contenido dinámico del carrito -->
        </div>

        <div class="cart-footer" id="cartFooter">
            <!-- Footer dinámico del carrito -->
        </div>
    </div>
</div>

<style>
/* ==========================================
   CARRITO FLOTANTE GLOBAL
   ========================================== */

#floating-cart-container {
    position: fixed;
    z-index: 9999;
    pointer-events: none; /* Permite clicks en el fondo */
}

/* Botón flotante del carrito */
.floating-cart-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(40, 167, 69, 0.4);
    transition: all 0.3s ease;
    pointer-events: auto;
    z-index: 10000;
}

.floating-cart-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(40, 167, 69, 0.5);
}

.floating-cart-btn:active {
    transform: translateY(-1px);
}

/* Icono del carrito */
.cart-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-svg-icon {
    width: 24px;
    height: 24px;
    filter: brightness(0) invert(1); /* Hace el icono blanco */
}

/* Badge del contador */
.cart-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #dc3545;
    color: white;
    font-size: 12px;
    font-weight: bold;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    min-width: 20px;
}

.cart-badge.hidden {
    display: none;
}

/* Overlay del carrito */
.cart-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9998;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: auto;
}

.cart-overlay.active {
    opacity: 1;
    visibility: visible;
}

/* Sidebar del carrito */
.cart-sidebar {
    position: fixed;
    top: 0;
    right: -400px;
    width: 400px;
    height: 100%;
    background: white;
    z-index: 9999;
    transition: right 0.3s ease;
    display: flex;
    flex-direction: column;
    pointer-events: auto;
}

.cart-sidebar.active {
    right: 0;
}

/* Header del carrito */
.cart-header {
    flex-shrink: 0;
}

/* Body del carrito */
.cart-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
}

/* Footer del carrito */
.cart-footer {
    flex-shrink: 0;
    padding: 1rem;
    border-top: 1px solid #dee2e6;
    background: #f8f9fa;
}

/* Responsive */
@media (max-width: 768px) {
    .floating-cart-btn {
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
    }
    
    .cart-sidebar {
        width: 100%;
        right: -100%;
    }
    
    .cart-svg-icon {
        width: 22px;
        height: 22px;
    }
}

/* Animación de pulso para nuevos items */
.floating-cart-btn.pulse {
    animation: cartPulse 0.6s ease;
}

@keyframes cartPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* Ocultar carrito en páginas específicas si es necesario */
.hide-floating-cart .floating-cart-btn {
    display: none;
}
</style>

<script>
/**
 * Inicializa el carrito flotante
 */
function initializeFloatingCart() {
    const floatingBtn = document.getElementById('floatingCartBtn');
    const cartOverlay = document.getElementById('cartOverlay');
    const closeCartBtn = document.getElementById('closeCart');
    
    if (floatingBtn) {
        floatingBtn.addEventListener('click', openFloatingCart);
    }
    
    if (cartOverlay) {
        cartOverlay.addEventListener('click', closeFloatingCart);
    }
    
    if (closeCartBtn) {
        closeCartBtn.addEventListener('click', closeFloatingCart);
    }
    
    // Actualizar badge inicial
    updateFloatingCartBadge();
}

// Cargar el carrito flotante cuando se carga el componente
document.addEventListener('DOMContentLoaded', function() {
    // Esperar un poco para asegurar que el componente se carga completamente
    setTimeout(() => {
        if (typeof initializeFloatingCart === 'function') {
            initializeFloatingCart();
        }
    }, 100);
});
</script>
