<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar - Catálogo</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del Carrito -->
    <link href="../../../css/carrito.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de gestión de usuarios -->
    <script src="../../../js/userManager.js"></script>

    <style>
        /* Estilo pequeño para el botón activo de categoría */
        .category-btn.active {
            background-color: #2f9e44;
            color: #fff;
            border-color: #2f9e44;
        }
        
        /* Animación para botón de agregar al carrito */
        .btn-success-animated {
            animation: pulseSuccess 0.5s;
        }
        
        @keyframes pulseSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* ESTILOS PARA UNIFICAR EL TAMAÑO DE IMÁGENES */
        .product-card img {
            height: 300px;
            object-fit: cover;
            width: 100%;
        }
        
        .product-card {
            display: flex;
            flex-direction: column;
        }
        
        .product-card .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* Estilos para la sección de información de productos */
        .product-info-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }
        
        .price-text {
            font-size: 1.1rem;
            color: #2f9e44 !important;
        }
        
        .stock-info {
            font-size: 0.9rem;
        }
        
        .add-to-cart-btn {
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .add-to-cart-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .product-card .card-text {
            font-size: 0.9rem;
            color: #6c757d;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <main>
        <!-- Header con imagen de fondo -->
        <section class="hero-section position-relative overflow-hidden" style="
            background: linear-gradient(135deg, rgba(46, 139, 87, 0.9), rgba(34, 139, 34, 0.8)), 
                        url('../../../img/manzana.webp');
            background-size: cover;
            background-position: center;
            min-height: 300px;
            display: flex;
            align-items: center;
        ">
            <div class="container text-center text-white">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <h1 class="display-4 fw-bold mb-3" style="font-family: 'Playfair Display', serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
                            Productos Frescos
                        </h1>
                        <p class="lead mb-4" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">
                            Descubre la frescura y calidad de nuestros productos orgánicos, directamente del huerto a tu mesa
                        </p>
                        <span class="badge bg-white text-success rounded-pill px-4 py-2 fs-6 fw-medium">
                            <i class="fas fa-leaf me-2"></i>100% Orgánico
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Barra de búsqueda y categorías -->
        <section class="py-5" style="background: linear-gradient(135deg, #f8fffe 0%, #f0f9f5 100%);">
            <div class="container">
                <!-- Barra de búsqueda central -->
                <div class="row justify-content-center mb-4">
                    <div class="col-lg-8">
                        <div class="position-relative">
                            <input id="searchInput" 
                                   type="text" 
                                   class="form-control form-control-lg border-0 shadow-sm rounded-pill ps-5" 
                                   placeholder="🔍 Buscar productos frescos..." 
                                   style="box-shadow: 0 8px 25px rgba(46, 139, 87, 0.15); height: 60px; font-size: 1.1rem;">
                            <i class="fas fa-search position-absolute start-0 top-50 translate-middle-y ms-4 text-success"></i>
                        </div>
                    </div>
                </div>
                
                <!-- Categorías -->
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <h5 class="text-center text-muted mb-4 fw-medium">Explora por categorías</h5>
                        <div class="d-flex flex-wrap justify-content-center gap-3">
                            <button class="btn btn-outline-success rounded-pill px-4 py-3 border-2 category-btn" data-category="frutas" style="min-width: 160px;">
                                <span class="fs-4 me-2">🍎</span>
                                <span class="fw-medium">Frutas Frescas</span>
                            </button>
                            <button class="btn btn-outline-success rounded-pill px-4 py-3 border-2 category-btn" data-category="verduras" style="min-width: 160px;">
                                <span class="fs-4 me-2">🥬</span>
                                <span class="fw-medium">Verduras Orgánicas</span>
                            </button>
                            <button class="btn btn-outline-success rounded-pill px-4 py-3 border-2 category-btn" data-category="organicos" style="min-width: 160px;">
                                <span class="fs-4 me-2">🌱</span>
                                <span class="fw-medium">Productos Orgánicos</span>
                            </button>
                            <button class="btn btn-outline-success rounded-pill px-4 py-3 border-2 category-btn" data-category="lacteos" style="min-width: 160px;">
                                <span class="fs-4 me-2">🥛</span>
                                <span class="fw-medium">Productos Lácteos</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Grid de productos -->
        <div class="container my-5">
          <h2 class="text-success text-center mb-4">Catálogo de Productos</h2>
          
          <!-- Contenedor dinámico para productos -->
          <div id="productos-container">
            <div class="row g-4" id="productos-grid">
              <!-- Loading placeholder -->
              <div class="col-12 text-center py-5" id="loading-products">
                <div class="spinner-border text-success" role="status">
                  <span class="visually-hidden">Cargando productos...</span>
                </div>
                <p class="mt-3 text-muted">Cargando productos frescos...</p>
              </div>
            </div>
          </div>
        </div>

    </main>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Scripts para cargar componentes y carrito -->
    <script src="../../../js/auth.js"></script>
    <script src="../../../js/productManager.js"></script>
    <script src="../../../js/carrito.js"></script>

    <script>
        // Variables globales para productos y filtros
        let todosLosProductos = [];
        let productosFiltrados = [];
        let categoriaActiva = 'todos';
        let busquedaActiva = '';

        document.addEventListener('DOMContentLoaded', function() {
            // Cargar navbar y footer
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
            
            // Inicializar sistemas después de un delay mínimo
            setTimeout(() => {
                console.log('=== TIMEOUT EJECUTÁNDOSE ===');
                console.log('Inicializando sistemas...');
                initializeCartSystem();
                cargarProductosCatalogo();
                // Forzar actualización del badge del carrito
                if (typeof updateFloatingCartBadge === 'function') {
                    updateFloatingCartBadge();
                }
            }, 500);

            // Configurar filtros de búsqueda y categorías
            configurarFiltros();
        });

        // Cargar productos desde productManager
        async function cargarProductosCatalogo() {
            try {
                console.log('=== INICIANDO CARGA DE PRODUCTOS ===');
                console.log('¿ProductManager disponible?', typeof productManager);
                
                if (typeof productManager === 'undefined') {
                    console.error('ProductManager no está disponible!');
                    return;
                }
                
                console.log('Llamando a productManager.obtenerProductosActivos()...');
                todosLosProductos = await productManager.obtenerProductosActivos();
                console.log('Productos obtenidos:', todosLosProductos);
                console.log('Cantidad de productos:', todosLosProductos ? todosLosProductos.length : 'null/undefined');
                
                // Mostrar productos
                mostrarProductos(todosLosProductos);
                
            } catch (error) {
                console.error('Error cargando productos:', error);
                mostrarErrorCarga();
            }
        }

        // Mostrar productos en el catálogo
        function mostrarProductos(productos) {
            const productosGrid = document.getElementById('productos-grid');
            const loadingElement = document.getElementById('loading-products');
            
            // Ocultar loading
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }

            if (!productos || productos.length === 0) {
                productosGrid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-search text-muted" style="font-size: 3rem;"></i>
                        <p class="mt-3 text-muted">No se encontraron productos</p>
                    </div>
                `;
                return;
            }

            productosGrid.innerHTML = '';
            
            productos.forEach(producto => {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 col-md-4 col-lg-3 product-col';
                col.setAttribute('data-category', producto.categoria);
                
                col.innerHTML = `
                    <div class="card product-card shadow-sm h-100 d-flex flex-column">
                        <img src="${producto.imagen}" 
                             class="card-img-top" 
                             alt="${producto.nombre}"
                             onerror="this.src='../../../img/default.jpg';">
                        <div class="card-body d-flex flex-column flex-grow-1">
                            <h5 class="card-title">PR${String(producto.id).padStart(3, '0')} - ${producto.nombre}</h5>
                            <p class="card-text flex-grow-1">${producto.descripcion}</p>
                            
                            <!-- Sección de precio y stock fija -->
                            <div class="product-info-section mt-auto pt-2 border-top">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div class="price-info">
                                        <span class="price-text fw-bold text-success">${formatearPrecio(producto.precio)}</span>
                                        <small class="text-muted d-block">por ${producto.peso}</small>
                                    </div>
                                    <div class="stock-info text-end">
                                        <small class="text-muted">Stock:</small>
                                        <span class="fw-bold ${producto.stock <= 5 ? 'text-warning' : 'text-success'}">${producto.stock}</span>
                                    </div>
                                </div>
                                
                                ${producto.stock <= 5 && producto.stock > 0 ? '<div class="text-center mb-2"><small class="text-warning"><i class="fas fa-exclamation-triangle"></i> ¡Últimas unidades!</small></div>' : ''}
                                
                                <button class="btn btn-success w-100 add-to-cart-btn" 
                                        data-id="PR${String(producto.id).padStart(3, '0')}" 
                                        data-name="${producto.nombre}" 
                                        data-price="${producto.precio}" 
                                        data-unit="/${producto.peso}" 
                                        data-image="${producto.imagen}" 
                                        data-stock="${producto.stock}"
                                        ${producto.stock === 0 ? 'disabled' : ''}>
                                    <i class="fas fa-shopping-cart me-1"></i>
                                    ${producto.stock === 0 ? 'Agotado' : 'Agregar al carrito'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                productosGrid.appendChild(col);
            });

            // Reinicializar eventos del carrito para los nuevos botones
            if (typeof initializeCartButtons === 'function') {
                initializeCartButtons();
            }
        }

        // Mostrar error de carga
        function mostrarErrorCarga() {
            const productosGrid = document.getElementById('productos-grid');
            const loadingElement = document.getElementById('loading-products');
            
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }

            productosGrid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fas fa-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <p class="mt-3 text-muted">Error al cargar productos</p>
                    <button class="btn btn-outline-success btn-sm" onclick="cargarProductosCatalogo()">
                        <i class="fas fa-redo me-1"></i>Reintentar
                    </button>
                </div>
            `;
        }

        // Configurar filtros de búsqueda y categorías
        function configurarFiltros() {
            const searchInput = document.getElementById("searchInput");
            const categoryButtons = document.querySelectorAll(".category-btn");

            // Filtro de búsqueda
            if (searchInput) {
                searchInput.addEventListener("input", function() {
                    busquedaActiva = this.value.toLowerCase();
                    aplicarFiltros();
                });
            }

            // Filtro de categorías
            categoryButtons.forEach(btn => {
                btn.addEventListener("click", function() {
                    const categoria = this.getAttribute('data-category');
                    
                    // Toggle active
                    const alreadyActive = this.classList.contains("active");
                    categoryButtons.forEach(b => b.classList.remove("active"));
                    
                    if (!alreadyActive) {
                        this.classList.add("active");
                        categoriaActiva = categoria;
                    } else {
                        categoriaActiva = 'todos';
                    }
                    
                    aplicarFiltros();
                });
            });
        }

        // Aplicar filtros combinados
        function aplicarFiltros() {
            let productosFiltrados = todosLosProductos;

            // Filtrar por categoría
            if (categoriaActiva && categoriaActiva !== 'todos') {
                productosFiltrados = productosFiltrados.filter(producto => 
                    producto.categoria === categoriaActiva
                );
            }

            // Filtrar por búsqueda
            if (busquedaActiva) {
                productosFiltrados = productosFiltrados.filter(producto =>
                    producto.nombre.toLowerCase().includes(busquedaActiva) ||
                    producto.descripcion.toLowerCase().includes(busquedaActiva) ||
                    producto.categoria.toLowerCase().includes(busquedaActiva)
                );
            }

            mostrarProductos(productosFiltrados);
        }

        // Función auxiliar para formatear precios
        function formatearPrecio(precio) {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP',
                minimumFractionDigits: 0
            }).format(precio);
        }
    </script>

</body>

</html>
