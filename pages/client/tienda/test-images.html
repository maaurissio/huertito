<!DOCTYPE html>
<html>
<head>
    <title>Test de Rutas de Imágenes</title>
</head>
<body>
    <h1>Test de Imágenes - Desde catalogo.html</h1>
    
    <h2>Prueba 1: Ruta original (incorrecta)</h2>
    <img src="img/espinaca.webp" alt="Espinaca - ruta incorrecta" style="width: 100px;">
    
    <h2>Prueba 2: Ruta corregida</h2>
    <img src="../../../img/espinaca.webp" alt="Espinaca - ruta corregida" style="width: 100px;">
    
    <h2>Prueba 3: Default fallback</h2>
    <img src="../../../img/default.jpg" alt="Default fallback" style="width: 100px;">
    
    <script src="../../../js/productManager.js"></script>
    <script>
        console.log('Testing productManager...');
        
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                console.log('ProductManager disponible:', typeof productManager);
                const productos = await productManager.obtenerProductosActivos();
                console.log('Productos obtenidos:', productos);
                console.log('Primera imagen:', productos[0]?.imagen);
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
