<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de autenticación -->
    <script src="../../../js/auth.js"></script>

</head>

<body class="login-page">
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Toast container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <!-- Formulario de Verificación con Card -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="card shadow-lg rounded-4 overflow-hidden">
                        <div class="row g-0">
                            <!-- Imagen izquierda como fondo completo -->
                            <div class="col-md-6 position-relative"
                                style="background-image: url('../../../img/huerto.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 500px;">
                                <!-- Overlay sutil -->
                                <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column p-4" style="background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.4));">
                                    <!-- Contenido central -->
                                    <div class="d-flex flex-column justify-content-center flex-grow-1 text-center text-white">
                                        <h3 class="fw-bold" style="font-family: 'Playfair Display', serif; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
                                            ¡Revisa tu Email!</h3>
                                        <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Hemos enviado un código de 6 dígitos</p>
                                    </div>
                                    
                                    <!-- Enlaces -->
                                    <div class="text-center" style="margin-bottom: 3rem;">
                                        <p class="text-white mb-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">¿No recibiste el código?</p>
                                        <a href="#" class="text-white text-decoration-none simple-link" id="resendCode">
                                            <i class="fas fa-redo me-2"></i>Reenviar código
                                        </a>
                                        <br><br>
                                        <a href="olvidoContrasena.html" class="text-white text-decoration-none simple-link">
                                            <i class="fas fa-arrow-left me-2"></i>Cambiar email
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <!-- Formulario derecha -->
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="w-100 p-5">
                                    <div class="text-center mb-4">
                                        <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                            Verificar Código</h2>
                                        <p class="text-muted">Ingresa el código de 6 dígitos enviado a:</p>
                                        <p class="text-success fw-bold mb-4" id="emailDisplay">email@ejemplo.com</p>
                                        <div class="text-muted small mb-3">
                                            <i class="fas fa-clock me-1"></i>
                                            El código expira en: <span id="countdown" class="text-warning fw-bold">15:00</span>
                                        </div>
                                    </div>

                                    <form id="verifyCodeForm">
                                        <div class="mb-4">
                                            <div class="input-icon-container">
                                                <input type="text" class="form-control form-control-lg text-center" 
                                                       id="verificationCode" placeholder="000000" maxlength="6" 
                                                       pattern="[0-9]{6}" required style="letter-spacing: 0.5em; font-size: 1.5rem;">
                                                <i class="fas fa-key input-icon"></i>
                                            </div>
                                            <div class="error-message d-none" id="codeError"></div>
                                            <div class="text-center mt-2">
                                                <small class="text-muted">Ingresa los 6 dígitos sin espacios</small>
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-success btn-lg w-100 mb-3" id="submitBtn">
                                            <span class="btn-text">Verificar Código</span>
                                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Script para cargar componentes -->
    <script>
        // Cargar componentes al inicializar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
        });
    </script>

    <!-- Script específico para verificación de código -->
    <script src="../../../js/verifyCode.js"></script>
</body>

</html>
