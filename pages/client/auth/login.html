<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de gestión de usuarios -->
    <script type="module" src="../../../js/userManager.js"></script>

    <!-- Sistema de autenticación -->
    <script defer src="../../../js/auth.js"></script>

</head>

<body class="login-page">
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Formulario de Login con Card -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="card shadow-lg rounded-4 overflow-hidden">
                        <div class="row g-0">
                            <!-- Imagen izquierda como fondo completo -->
                            <div class="col-md-6 position-relative"
                                style="background-image: url('../../../img/huerto.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 500px;">
                                <!-- Overlay sutil -->
                                <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column p-4" style="background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.4));">
                                    <!-- Contenido central -->
                                    <div class="d-flex flex-column justify-content-center flex-grow-1 text-center text-white">
                                        <h3 class="fw-bold" style="font-family: 'Playfair Display', serif; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
                                            ¡Productos Frescos!</h3>
                                        <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Directo del huerto a tu hogar</p>
                                    </div>
                                    
                                    <!-- Botón alineado con el botón del formulario -->
                                    <div class="text-center" style="margin-bottom: 3rem;">
                                        <p class="text-white mb-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">¿No tienes cuenta?</p>
                                        <a href="registro.html" class="text-white text-decoration-none simple-link" onclick="guardarPaginaOrigen()">
                                            Regístrate aquí
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <!-- Formulario derecha -->
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="w-100 p-5">
                                    <div class="text-center mb-4">
                                        <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                            Iniciar Sesión</h2>
                                        <p class="text-muted">Accede a tu cuenta de Huerto Hogar</p>
                                    </div>

                                    <form id="loginForm">
                                        <div class="mb-3">
                                            <div class="input-icon-container">
                                                <input type="email" class="form-control form-control-lg" id="email"
                                                    placeholder="Correo Electrónico" required>
                                                <i class="fas fa-envelope input-icon"></i>
                                            </div>
                                        </div>

                                        <div class="mb-4">
                                            <div class="input-icon-container">
                                                <input type="password" class="form-control form-control-lg" id="password"
                                                    placeholder="Contraseña" required>
                                                <i class="fas fa-lock input-icon"></i>
                                            </div>
                                        </div>

                                        <div class="mb-3 form-check">
                                            <input type="checkbox" class="form-check-input" id="remember">
                                            <label class="form-check-label" for="remember">
                                                Recordar mi sesión
                                            </label>
                                        </div>

                                        <div class="mb-4">
                                            <div class="text-center">
                                                <a href="olvidoContrasena.html" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-success btn-lg w-100 mb-3">Iniciar
                                            Sesión</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Script para cargar componentes -->
    <script>
        // Cargar componentes al inicializar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
        });

        // Interceptor más robusto para eliminar undefined completamente
        const originalAlert = window.alert;
        const originalConsoleError = console.error;
        
        window.alert = function(message) {
            if (message === undefined || message === 'undefined' || message === null || message === 'null') {
                console.warn('🚫 Blocked undefined/null alert. Stack trace:');
                console.trace();
                return;
            }
            originalAlert.call(window, message);
        };

        // También interceptar errores que podrían causar alerts
        console.error = function(...args) {
            // Filtrar errores que contengan undefined
            const filteredArgs = args.filter(arg => {
                if (typeof arg === 'string' && arg.includes('undefined')) {
                    console.warn('🚫 Filtered undefined error:', arg);
                    return false;
                }
                return true;
            });
            
            if (filteredArgs.length > 0) {
                originalConsoleError.apply(console, filteredArgs);
            }
        };

        // Interceptar también promises rechazadas sin manejar
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (event.reason === 'undefined' || event.reason.toString().includes('undefined'))) {
                console.warn('🚫 Blocked undefined promise rejection');
                event.preventDefault();
            }
        });

        // Manejar el formulario de login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            console.log('🔵 LOGIN: Iniciando proceso de login...');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('button[type="submit"]');
            
            console.log('🔵 LOGIN: Credenciales obtenidas:', { email, password: '***' });
            
            // Mostrar estado de carga
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando...';
            submitBtn.disabled = true;
            
            try {
                console.log('🔵 LOGIN: Llamando validarLogin...');
                const resultado = await validarLogin(email, password);
                console.log('🔵 LOGIN: Resultado recibido:', resultado);
                
                if (resultado && (resultado.exito || resultado.success)) {
                    console.log('🟢 LOGIN: Éxito! Usuario:', resultado.usuario);
                    // Login exitoso
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> ¡Bienvenido!';
                    
                    // Redirigir después de un momento
                    setTimeout(() => {
                        if (resultado.usuario) {
                            console.log('🔵 LOGIN: Redirigiendo usuario...'); 
                            redirigirSegunRol(resultado.usuario);
                        } else {
                            console.error('🔴 LOGIN: No hay datos de usuario para redirección');
                        }
                    }, 1500);
                    
                } else {
                    console.log('🔴 LOGIN: Fallo en credenciales:', resultado);
                    // Mostrar error en botón
                    submitBtn.innerHTML = '<i class="fas fa-times"></i> Credenciales incorrectas';
                    submitBtn.classList.remove('btn-success');
                    submitBtn.classList.add('btn-danger');
                    
                    // Restaurar botón después de un momento
                    setTimeout(() => {
                        submitBtn.innerHTML = originalText;
                        submitBtn.classList.remove('btn-danger');
                        submitBtn.classList.add('btn-success');
                        submitBtn.disabled = false;
                    }, 2000);
                }
                
            } catch (error) {
                // Mostrar error en botón
                submitBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error de conexión';
                submitBtn.classList.remove('btn-success');
                submitBtn.classList.add('btn-danger');
                
                // Restaurar botón
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.remove('btn-danger');
                    submitBtn.classList.add('btn-success');
                    submitBtn.disabled = false;
                }, 2000);
            }
        });
    </script>
</body>

</html>
