<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de autenticación -->
    <script src="../../../js/auth.js"></script>

</head>

<body>
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Formulario de Login con Card -->
    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card shadow-lg rounded-4 overflow-hidden login-card">
                    <div class="row g-0 h-100">
                        <!-- Imagen izquierda como fondo completo -->
                        <div class="col-md-6 login-image-side"
                            style="background-image: url('../../../img/huerto.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; position: relative;">
                            <!-- Overlay opcional para el texto -->
                            <div class="login-image-overlay">
                                <div class="text-center text-white p-4">
                                    <h3 class="mb-3"
                                        style="font-family: 'Playfair Display', serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.7);">
                                        ¡Productos Frescos!</h3>
                                    <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Directo del huerto
                                        a tu hogar</p>
                                    <p class="small" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Calidad
                                        garantizada y sabor natural</p>
                                </div>
                            </div>
                        </div>

                        <!-- Formulario derecha -->
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="w-100 p-5">
                                <div class="text-center mb-4">
                                    <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                        Iniciar Sesión</h2>
                                    <p class="text-muted">Accede a tu cuenta de Huerto Hogar</p>
                                </div>

                                <form id="loginForm">
                                    <div class="mb-3">
                                        <div class="input-icon-container">
                                            <input type="email" class="form-control form-control-lg" id="email"
                                                placeholder="Correo Electrónico" required>
                                            <i class="fas fa-envelope input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="input-icon-container">
                                            <input type="password" class="form-control form-control-lg" id="password"
                                                placeholder="Contraseña" required>
                                            <i class="fas fa-lock input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="remember">
                                        <label class="form-check-label" for="remember">
                                            Recordar mi sesión
                                        </label>
                                    </div>

                                    <div class="mb-4">
                                        <div class="text-center">
                                            <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3">Iniciar
                                        Sesión</button>

                                    <hr class="my-4">

                                    <div class="text-center">
                                        <p class="mb-3 text-muted">¿No tienes una cuenta?</p>
                                        <a href="registro.html" class="btn btn-outline-success btn-lg w-100">Crear
                                            Cuenta Nueva</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Script para cargar componentes -->
    <script>
        // Cargar componentes al inicializar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
        });
    </script>
</body>

</html>
