<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de autenticación -->
    <script type="module" src="../../../js/auth.js"></script>

</head>

<body class="login-page">
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Toast container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <!-- Formulario de Recuperación con Card -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="card shadow-lg rounded-4 overflow-hidden">
                        <div class="row g-0">
                            <!-- Imagen izquierda como fondo completo -->
                            <div class="col-md-6 position-relative"
                                style="background-image: url('../../../img/huerto.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 500px;">
                                <!-- Overlay sutil -->
                                <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column p-4" style="background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.4));">
                                    <!-- Contenido central -->
                                    <div class="d-flex flex-column justify-content-center flex-grow-1 text-center text-white">
                                        <h3 class="fw-bold" style="font-family: 'Playfair Display', serif; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
                                            ¡Recupera tu Cuenta!</h3>
                                        <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Te ayudamos a volver a tu huerto</p>
                                    </div>
                                    
                                    <!-- Botón alineado con el botón del formulario -->
                                    <div class="text-center" style="margin-bottom: 3rem;">
                                        <p class="text-white mb-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">¿Recordaste tu contraseña?</p>
                                        <a href="login.html" class="text-white text-decoration-none simple-link">
                                            <i class="fas fa-arrow-left me-2"></i>Volver al inicio de sesión
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <!-- Formulario derecha -->
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="w-100 p-5">
                                    <div class="text-center mb-4">
                                        <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                            Recuperar Contraseña</h2>
                                        <p class="text-muted">Ingresa tu correo y te enviaremos un enlace</p>
                                    </div>

                                    <!-- Mensaje de éxito -->
                                    <div class="alert alert-success d-none" id="successMessage">
                                        <i class="fas fa-check-circle me-2"></i>
                                        Se ha enviado un enlace de recuperación a tu correo electrónico.
                                    </div>

                                    <form id="forgotPasswordForm">
                                        <div class="mb-4">
                                            <div class="input-icon-container">
                                                <input type="email" class="form-control form-control-lg" id="email"
                                                    placeholder="Correo Electrónico" required>
                                                <i class="fas fa-envelope input-icon"></i>
                                            </div>
                                            <div class="error-message d-none" id="emailError"></div>
                                        </div>

                                        <button type="submit" class="btn btn-success btn-lg w-100 mb-3" id="submitBtn">
                                            <span class="btn-text">Enviar codigo de recuperación</span>
                                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Script para cargar componentes -->
    <script>
        // Cargar componentes al inicializar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
        });
    </script>

    <!-- Script específico para recuperación de contraseña -->
    <script src="../../../js/forgotPassword.js"></script>
</body>

</html>
