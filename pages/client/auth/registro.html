<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

</head>

<body>
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Formulario de Registro con Card -->
    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card shadow-lg rounded-4 overflow-hidden login-card">
                    <div class="row g-0 h-100">
                        <!-- Formulario izquierda -->
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="w-100 p-5">
                                <div class="text-center mb-4">
                                    <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                        Crear Cuenta</h2>
                                    <p class="text-muted">Únete a la comunidad de Huerto Hogar</p>
                                </div>

                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label for="name" class="form-label fw-semibold">Usuario</label>
                                        <input type="text" class="form-control form-control-lg" id="name"
                                            placeholder="Tu usuario" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                        <input type="email" class="form-control form-control-lg" id="email"
                                            placeholder="tu@correo.com" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                                        <input type="password" class="form-control form-control-lg" id="password"
                                            placeholder="••••••••" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="confirmPassword" class="form-label fw-semibold">Confirmar
                                            Contraseña</label>
                                        <input type="password" class="form-control form-control-lg" id="confirmPassword"
                                            placeholder="••••••••" required>
                                    </div>

                                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3">Crear
                                        Cuenta</button>

                                    <hr class="my-4">

                                    <div class="text-center">
                                        <p class="mb-3 text-muted">¿Ya tienes una cuenta?</p>
                                        <a href="login.html" class="btn btn-outline-success btn-lg w-100">Iniciar
                                            Sesión</a>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Imagen derecha como fondo completo -->
                        <div class="col-md-6 login-image-side"
                            style="background-image: url('../../../img/huerto1.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; position: relative;">
                            <!-- Overlay opcional para el texto -->
                            <div class="login-image-overlay">
                                <div class="text-center text-white p-4">
                                    <h3 class="mb-3"
                                        style="font-family: 'Playfair Display', serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.7);">
                                        ¡Únete a nosotros!</h3>
                                    <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Crea tu cuenta y
                                        disfruta nuestros productos frescos</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>
</body>

</html>
