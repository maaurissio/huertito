<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar</title>

    <!-- CSS Personalizado -->
    <link href="../../../css/style.css" rel="stylesheet">

    <!-- CSS BootStrap -->
    <link href="../../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- JS BootStrap -->
    <script src="../../../js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript para componentes compartidos -->
    <script src="../shared/components.js"></script>

    <!-- Sistema de gestión de usuarios -->
    <script type="module" src="../../../js/userManager.js"></script>

    <!-- Sistema de autenticación -->
    <script defer src="../../../js/auth.js"></script>

</head>

<body class="registro-page">
    <!-- Contenedor para la navbar (se carga automáticamente) -->
    <div id="navbar-container"></div>

    <!-- Formulario de Registro con Card -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="card shadow-lg rounded-4 overflow-hidden">
                        <div class="row g-0">
                        <!-- Formulario izquierda -->
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="w-100 p-5">
                                <div class="text-center mb-4">
                                    <h2 style="font-family: 'Playfair Display', serif;" class="text-success mb-2">
                                        Crear Cuenta</h2>
                                    <p class="text-muted">Únete a la comunidad de Huerto Hogar</p>
                                </div>

                                <form id="registerForm">
                                    <div class="mb-3">
                                        <div class="input-icon-container">
                                            <input type="text" class="form-control form-control-lg" id="fullName"
                                                placeholder="Nombre Completo" required>
                                            <i class="fas fa-user input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="input-icon-container">
                                            <input type="email" class="form-control form-control-lg" id="email"
                                                placeholder="Correo Electrónico" required>
                                            <i class="fas fa-envelope input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="input-icon-container">
                                            <input type="password" class="form-control form-control-lg" id="password"
                                                placeholder="Contraseña" required>
                                            <i class="fas fa-lock input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <div class="input-icon-container">
                                            <input type="password" class="form-control form-control-lg" id="confirmPassword"
                                                placeholder="Confirmar Contraseña" required>
                                            <i class="fas fa-lock input-icon"></i>
                                        </div>
                                    </div>

                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="acceptPolicies" required>
                                        <label class="form-check-label" for="acceptPolicies">
                                            Acepto los <a href="../info/terminos.html" class="text-success text-decoration-none">términos y condiciones</a> y las <a href="../info/privacidad.html " class="text-success text-decoration-none">políticas de privacidad</a>
                                        </label>
                                    </div>

                                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3" id="createAccountBtn">
                                        <span class="btn-text">Crear Cuenta</span>
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Imagen derecha como fondo completo -->
                        <div class="col-md-6 position-relative"
                            style="background-image: url('../../../img/huerto.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 500px;">
                            <!-- Overlay sutil -->
                            <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column p-4" style="background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.4));">
                                <!-- Contenido central -->
                                <div class="d-flex flex-column justify-content-center flex-grow-1 text-center text-white">
                                    <h3 class="fw-bold" style="font-family: 'Playfair Display', serif; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);">
                                        ¡Únete Hoy!</h3>
                                    <p class="mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">Productos frescos y naturales</p>
                                </div>
                                
                                <!-- Botón alineado con el botón del formulario -->
                                <div class="text-center" style="margin-bottom: 3rem;">
                                    <p class="text-white mb-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">¿Ya tienes cuenta?</p>
                                    <a href="login.html" class="text-white text-decoration-none simple-link">
                                        Inicia sesión
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor para el footer (se carga automáticamente) -->
    <div id="footer-container"></div>

    <!-- Script para validación del formulario -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            const acceptPolicies = document.getElementById('acceptPolicies');
            const createAccountBtn = document.getElementById('createAccountBtn');

            // Función para validar el estado del checkbox
            function validatePolicies() {
                if (acceptPolicies.checked) {
                    // Agregar clase de animación de relleno
                    createAccountBtn.classList.add('filling');
                    
                    // Después de la animación, habilitar el botón
                    setTimeout(() => {
                        createAccountBtn.disabled = false;
                        createAccountBtn.classList.remove('btn-secondary', 'filling');
                        createAccountBtn.classList.add('btn-success');
                    }, 500); // Duración total: 0.5 segundos
                    
                } else {
                    createAccountBtn.disabled = true;
                    createAccountBtn.classList.remove('btn-success', 'filling');
                    createAccountBtn.classList.add('btn-secondary');
                }
            }

            // Validar al cargar la página
            validatePolicies();

            // Escuchar cambios en el checkbox
            acceptPolicies.addEventListener('change', validatePolicies);

            // Validar al enviar el formulario
            form.addEventListener('submit', function(e) {
                if (!acceptPolicies.checked) {
                    e.preventDefault();
                    mostrarNotificacion('Debes aceptar los términos y condiciones para crear una cuenta.', 'warning');
                    return false;
                }

                // Validar que las contraseñas coincidan
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    e.preventDefault();
                    mostrarNotificacion('Las contraseñas no coinciden.', 'error');
                    return false;
                }

                // Si todo está bien, proceder con el registro
                mostrarNotificacion('¡Cuenta creada exitosamente!', 'success');
            });
        });
    </script>

    <!-- Script para cargar componentes -->
    <script>
        // Cargar componentes al inicializar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadComponent('navbar-container', '../shared/navbar.html');
            loadComponent('footer-container', '../shared/footer.html');
        });
    </script>
</body>

</html>
