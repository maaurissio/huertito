<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Huertito</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../../css/style.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
<div class="sidebar">
  <h2 class="sidebar-title">Huertito</h2>
  <ul class="sidebar-menu">
    <li><a href="dashboard.html" class="active">📊 Dashboard</a></li>
    <li><a href="productos.html">🛒 Productos</a></li>
    <li><a href="usuarios.html">👥 Usuarios</a></li>
    <li><a href="seguimiento.html">📦 Seguimiento</a></li>
  </ul>
</div>


  <!-- Main Content -->
  <div class="main-content">
    <header class="dashboard-header">
      <h1>Panel de Administrador</h1>
      <button class="btn btn-danger btn-sm">Cerrar sesión</button>
    </header>

    <!-- Stats Cards -->
    <section class="stats">
      <div class="card stat-card">
        <h3>$25,300</h3>
        <p>Ventas del mes</p>
      </div>
      <div class="card stat-card">
        <h3>120</h3>
        <p>Productos activos</p>
      </div>
      <div class="card stat-card">
        <h3>85</h3>
        <p>Usuarios registrados</p>
      </div>
    </section>

    <!-- Chart -->
    <section class="chart-section card">
      <h2>Ventas del mes</h2>
      <canvas id="salesChart"></canvas>
    </section>


  <!-- Script Chart -->
  <script>
    const ctx = document.getElementById('salesChart');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
        datasets: [{
          label: 'Ventas ($)',
          data: [1200, 1900, 3000, 2500, 2800, 3500, 4200, 4800, 5000, 6000, 7000, 8000],
          borderColor: '#198754',
          backgroundColor: 'rgba(25,135,84,0.2)',
          borderWidth: 2,
          tension: 0.4
        },
    ]
        
      }
      
    });
  </script>
</body>
</html>
