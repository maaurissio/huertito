<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - Huertito</title>
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2 class="sidebar-title">Huertito</h2>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="productos.html" class="active">🛒 Productos</a></li>
      <li><a href="usuarios.html">👥 Usuarios</a></li>
      <li><a href="seguimiento.html">📦 Seguimiento</a></li>
    </ul>
  </div>

  <!-- Main -->
  <div class="main-content">
    <header class="dashboard-header">
      <h1>Gestión de Productos</h1>
    </header>

    <section class="products-section card">
      <button class="btn btn-success mb-3" onclick="agregarProducto()">➕ Agregar producto</button>
      <table class="table table-striped" id="tablaProductos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td><td>Tomates</td><td>$1500</td><td>50</td>
            <td>
              <button class="btn btn-warning btn-sm">Editar</button>
              <button class="btn btn-danger btn-sm">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <script>
    let contador = 2;
    function agregarProducto() {
      const tabla = document.getElementById("tablaProductos").getElementsByTagName("tbody")[0];
      let fila = tabla.insertRow();
      fila.innerHTML = `
        <td>${contador++}</td>
        <td>Nuevo producto</td>
        <td>$0</td>
        <td>0</td>
        <td>
          <button class="btn btn-warning btn-sm">Editar</button>
          <button class="btn btn-danger btn-sm">Eliminar</button>
        </td>`;
    }
  </script>
</body>
</html>
